<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Simulador realista do teclado da urna eletrônica brasileira">
  <title>Teclado da Urna Eletrônica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal centralizado -->
  <main class="urna-wrapper" role="main">
    
    <!-- Painel do Teclado -->
    <div class="teclado-painel" id="tecladoPainel" role="region" aria-label="Teclado da Urna Eletrônica">
      
      <!-- Parafusos estéticos nos 4 cantos da carcaça industrial -->
      <span class="parafuso parafuso-tl" aria-hidden="true"></span>
      <span class="parafuso parafuso-tr" aria-hidden="true"></span>
      <span class="parafuso parafuso-bl" aria-hidden="true"></span>
      <span class="parafuso parafuso-br" aria-hidden="true"></span>

      <!-- Barra superior do teclado com identificação sutil e controle de áudio -->
      <div class="teclado-topo">
        <span class="teclado-marca" aria-label="Teclado Urna Eletrônica">Teclado Urna Eletrônica</span>
        <button type="button" class="btn-som" id="btnSom" aria-label="Alternar som do teclado" title="Ativar/Desativar som">
          <svg class="icone-som icone-som-ativo" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="icone-som icone-som-mudo" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>

      <!-- Grade dos números (1 a 9, e 0 centralizado) -->
      <div class="teclado-numeros" role="group" aria-label="Teclado numérico">
        <button type="button" class="tecla tecla-numero" data-tecla="1" aria-label="Número 1">
          <span class="tecla-digito">1</span>
          <span class="tecla-braille" aria-hidden="true">⠁</span>
        </button>
        <button type="button" class="tecla tecla-numero" data-tecla="2" aria-label="Número 2">
          <span class="tecla-digito">2</span>
          <span class="tecla-braille" aria-hidden="true">⠃</span>
        </button>
        <button type="button" class="tecla tecla-numero" data-tecla="3" aria-label="Número 3">
          <span class="tecla-digito">3</span>
          <span class="tecla-braille" aria-hidden="true">⠉</span>
        </button>

        <button type="button" class="tecla tecla-numero" data-tecla="4" aria-label="Número 4">
          <span class="tecla-digito">4</span>
          <span class="tecla-braille" aria-hidden="true">⠙</span>
        </button>
        <button type="button" class="tecla tecla-numero tecla-cinco" data-tecla="5" aria-label="Número 5, com ponto tátil de orientação">
          <span class="tecla-digito">5</span>
          <span class="tecla-relevo" aria-hidden="true"></span>
          <span class="tecla-braille" aria-hidden="true">⠑</span>
        </button>
        <button type="button" class="tecla tecla-numero" data-tecla="6" aria-label="Número 6">
          <span class="tecla-digito">6</span>
          <span class="tecla-braille" aria-hidden="true">⠋</span>
        </button>

        <button type="button" class="tecla tecla-numero" data-tecla="7" aria-label="Número 7">
          <span class="tecla-digito">7</span>
          <span class="tecla-braille" aria-hidden="true">⠛</span>
        </button>
        <button type="button" class="tecla tecla-numero" data-tecla="8" aria-label="Número 8">
          <span class="tecla-digito">8</span>
          <span class="tecla-braille" aria-hidden="true">⠓</span>
        </button>
        <button type="button" class="tecla tecla-numero" data-tecla="9" aria-label="Número 9">
          <span class="tecla-digito">9</span>
          <span class="tecla-braille" aria-hidden="true">⠊</span>
        </button>

        <!-- Linha do zero centralizado -->
        <div class="espaco-vazio" aria-hidden="true"></div>
        <button type="button" class="tecla tecla-numero" data-tecla="0" aria-label="Número 0">
          <span class="tecla-digito">0</span>
          <span class="tecla-braille" aria-hidden="true">⠚</span>
        </button>
        <div class="espaco-vazio" aria-hidden="true"></div>
      </div>

      <!-- Teclas de ação: BRANCO, CORRIGE e CONFIRMA -->
      <div class="teclado-acoes" role="group" aria-label="Teclas de controle de voto">
        <button type="button" class="tecla tecla-acao tecla-branco" data-tecla="BRANCO" aria-label="Voto em Branco">
          <span class="tecla-texto">BRANCO</span>
        </button>
        <button type="button" class="tecla tecla-acao tecla-corrige" data-tecla="CORRIGE" aria-label="Corrige número digitado">
          <span class="tecla-texto">CORRIGE</span>
        </button>
        <button type="button" class="tecla tecla-acao tecla-confirma" data-tecla="CONFIRMA" aria-label="Confirma voto">
          <span class="tecla-texto">CONFIRMA</span>
        </button>
      </div>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
